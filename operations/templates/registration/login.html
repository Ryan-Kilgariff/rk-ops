<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>
        RK Ops | Login
    </title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 32px;
        }
        .brand {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }
        .subtitle {
            color: #6b7280;
            margin: 0 0 26px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
        }
        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 12px;
            background: #111827;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .error {
            margin-bottom: 18px;
            background: #fef2f2;
            color: #b91c1c;
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 14px;
        }
        .auth-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
        }
        .auth-footer a {
            font-weight: 600;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">
        RK OPS
    </div>
    <h1>
        Welcome back
    </h1>
    <p class="subtitle">
        Sign in to access property operations.
    </p>
    {% if form.errors %}
        <div class="error">
            Your username or password was incorrect.
        </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {% if next %}
        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >
    {% endif %}
        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">
                Username
            </label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="{{ form.password.id_for_label }}">
                Password
            </label>
            {{ form.password }}
        </div>
        <button type="submit">
            Sign In
        </button>
    </form>
    <div class="auth-footer">
        <span>
            New to RK Ops?
        </span>
        <a href="{% url 'operations:signup' %}">
            Create an account
        </a>
    </div>
</div>
</body>
</html>
