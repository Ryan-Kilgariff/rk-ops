{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>
        RK Ops | Login
    </title>
    <link
        rel="stylesheet"
        href="{% static 'operations/css/operations.css' %}"
    >
</head>
<body>
<div class="login-card">
    <div class="brand">
        RK OPS
    </div>
    <h1>
        Welcome back
    </h1>
    <p class="subtitle">
        Sign in to access property operations.
    </p>
    {% if form.errors %}
        <div class="error">
            Your username or password was incorrect.
        </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {% if next %}
        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >
    {% endif %}
        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">
                Username or email
            </label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="{{ form.password.id_for_label }}">
                Password
            </label>
            {{ form.password }}
        </div>
        <button type="submit">
            Sign In
        </button>
    </form>
    <div class="auth-footer">
        <span>
            New to RK Ops?
        </span>
        <a href="{% url 'operations:signup' %}">
            Create an account
        </a>
    </div>
</div>
</body>
</html>
